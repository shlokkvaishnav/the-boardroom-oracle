  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#2B2B3D" stroke-width="2.5"/>
  <circle cx="32" cy="10.5" r="7.5" fill="#3BA55D"/>
  <circle cx="53.5" cy="32" r="7.5" fill="#ED4245"/>
  <circle cx="32" cy="53.5" r="7.5" fill="#5865F2"/>
  <circle cx="10.5" cy="32" r="7.5" fill="#FAA61A"/>
</svg>
