[project]
name = "boardroom-oracle-backend"
version = "0.1.0"
description = "Live multi-agent AI negotiation demo — backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.116",
    "faster-whisper>=1.1",
    "networkx>=3.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Required by FastAPI to parse multipart/form-data — the voice-offer upload.
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Required by FastAPI's TestClient.
    "httpx>=0.27",
]

# This is an application, not a distributable library: uv installs the
# dependencies but does not try to build/install the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
