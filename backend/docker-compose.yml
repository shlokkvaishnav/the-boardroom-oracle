name: four-chairs

services:
  api:
    build:
      context: .
    image: four-chairs-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Live-reload the source during development.
      - ./app:/srv/app
      - ./tests:/srv/tests
      # Persist downloaded Whisper weights across container restarts.
      - whisper-cache:/home/app/.cache/huggingface
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  whisper-cache:
